services:
  ckrof-agent:
    image: ckrof-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ckrof_agent_live
    restart: unless-stopped
    ports:
      - "${CKROF_AGENT_PORT:-9090}:${CKROF_AGENT_PORT:-9090}"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    
    # Optional: If you ever want to test this image locally against a local dev RabbitMQ,
    # uncomment the lines below to re-enable local host machine routing:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"